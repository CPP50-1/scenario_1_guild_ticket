<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster</title>
    
    <!-- 1. Import Pico CSS from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

    <script type="module">
        // 1. PARSING: Robust state-machine CSV parser
        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentValue = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        currentValue += '"'; 
                        i++;                 
                    } else {
                        inQuotes = !inQuotes; 
                    }
                    continue; 
                }
                if (inQuotes) {
                    currentValue += char;
                    continue;
                }
                switch (char) {
                    case ',':
                        currentRow.push(currentValue);
                        currentValue = "";
                        break;
                    case '\r':
                        if (text[i + 1] === '\n') i++; 
                    case '\n':
                        currentRow.push(currentValue);
                        rows.push(currentRow);
                        currentRow = [];
                        currentValue = "";
                        break;
                    default:
                        currentValue += char;
                }
            }
            if (currentValue || currentRow.length > 0) {
                currentRow.push(currentValue);
                rows.push(currentRow);
            }
            return rows.filter(row => row.some(cell => cell.trim() !== ''));
        }

        // 2. RENDERING: Populate the semantic table dynamically
        async function populateTable(table) {
            const src = table.dataset.csvSrc;
            if (!src) return;

            try {
                const response = await fetch(src);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const text = await response.text();
                const data = parseCSV(text);
                
                if (data.length === 0) {
                    table.innerHTML = "<caption>CSV is empty.</caption>";
                    return;
                }

                const [headers, ...rows] = data;
                
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                headerRow.append(...headers.map(text => {
                    // Pico CSS styling applies automatically to standard th tags
                    const th = document.createElement("th");
                    th.setAttribute('scope', 'col'); // Good accessibility practice
                    th.textContent = text.trim();
                    return th;
                }));
                thead.appendChild(headerRow);

                const tbody = document.createElement("tbody");
                for (const rowData of rows) {
                    const tr = document.createElement("tr");
                    tr.append(...rowData.map(text => {
                        const td = document.createElement("td");
                        td.textContent = text.trim();
                        return td;
                    }));
                    tbody.appendChild(tr);
                }

                table.replaceChildren(thead, tbody);

            } catch (error) {
                console.error('Error loading CSV:', error);
                table.innerHTML = `<caption>Error loading data.</caption>`;
            }
        }

        // 3. ORCHESTRATION
        document.querySelectorAll('table[data-csv-src]').forEach(populateTable);
    </script>
</head>
<body>
    <!-- Pico CSS uses class="container" to center content and add responsive padding -->
    <main class="container">
        <header>
            <h1>Roster</h1>
        </header>
        
        <!-- 
            Pico recommends wrapping tables in a .overflow-auto div 
            so they scroll horizontally on mobile devices instead of breaking the layout.
        -->
        <div class="overflow-auto">
            <!-- 100% pure semantic HTML. No CSS classes required! -->
            <table data-csv-src="exports/roster.csv">
                <caption>Loading table data...</caption>
            </table>
        </div>
    </main>
</body>
</html>
