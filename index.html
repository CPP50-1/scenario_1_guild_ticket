<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster</title>

    <!-- 1. Import Open Props and its excellent Normalize script -->
    <link rel="stylesheet" href="https://unpkg.com/open-props" />
    <link rel="stylesheet" href="https://unpkg.com/open-props/normalize.min.css" />

    <style>
        /* 
         * 2. STYLING WITH TOKENS
         * We write standard CSS, but inject Open Props variables for perfect 
         * colors, spacing, typography, and shadows.
         */
        body {
            align-items: center;
            background-color: var(--surface-2);
            display: flex;
            flex-direction: column;
            padding: var(--size-5) var(--size-3);
        }

        header {
            margin-bottom: var(--size-5);
            text-align: center;
        }

        h1 {
            color: var(--text-1);
            font-size: var(--font-size-fluid-2);
            font-weight: var(--font-weight-8);
            letter-spacing: var(--font-letterspacing-2);
        }

        .table-container {
            background-color: var(--surface-1);
            border-radius: var(--radius-3);
            border: 1px solid var(--surface-3);
            box-shadow: var(--shadow-4);
            max-width: var(--size-content-4);
            overflow-x: auto;
            width: 100%;
        }

        table {
            background: transparent;
            border-collapse: collapse;
            display: grid;
            grid-template-columns: repeat(var(--col-count,5), minmax(150px, 1fr));
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
            width: 100%;
           


            thead,
            tbody,
            tr {
                display: grid;
                grid-template-columns: subgrid;
                grid-column: 1 / -1;
            }

            thead {
                background-color: inherit;
                position: sticky;
                top: 0;
                z-index: 1;
            }

            &:empty::after {
                animation: var(--animation-pulse);
                color: var(--text-3);
                content: "Loading roster data...";
                display: block;
                font-style: italic;
                padding: var(--size-6);
                text-align: center;
            }

            th,
            td {
                border-bottom: 1px solid var(--surface-3);
                padding: var(--size-3) var(--size-4);
            }

            th {
                background-color: var(--surface-1);
                box-shadow: 0 1px 0 var(--surface-4);
                color: var(--text-2);
                font-weight: var(--font-weight-6);
                position: sticky;
                top: 0;
            }

            tbody tr:hover td {
                background-color: var(--surface-2);
                transition: background-color 0.2s ease;
            }


        }
    </style>

    <script type="module">
        const hiddenColumns = []
        // const hiddenColumns = ["id", "role", "level", "hp"];

        const headerAliases = {
            "id": "ID",
            "name": "Name",
            "role": "Role",
            "level": "Level",
            "hp": "HP",
            "status": "Status",
            "guild_name": "Guild",
        };

        // 1. PARSING: Robust state-machine CSV parser
        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentValue = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                // 1. Handle escaped quotes ("") inside quotes
                if (char === '"' && inQuotes && text[i + 1] === '"') {
                    currentValue += '"';
                    i++;
                    continue;
                }

                // 2. Handle opening or closing quotes
                if (char === '"') {
                    inQuotes = !inQuotes;
                    continue;
                }

                // 3. Any other character inside quotes is part of the value
                if (inQuotes) {
                    currentValue += char;
                    continue;
                }

                // 4. Handle column separator
                if (char === ',') {
                    currentRow.push(currentValue);
                    currentValue = "";
                    continue;
                }

                // 5. Handle row separators (\r, \n, or \r\n)
                if (char === '\r' || char === '\n') {
                    if (char === '\r' && text[i + 1] === '\n') i++; // Skip the \n in \r\n sequences

                    currentRow.push(currentValue);
                    rows.push(currentRow);
                    currentRow = [];
                    currentValue = "";
                    continue;
                }

                // 6. Normal characters outside of quotes
                currentValue += char;
            }
            if (currentValue || currentRow.length > 0) {
                currentRow.push(currentValue);
                rows.push(currentRow);
            }
            return rows.filter(row => row.some(cell => cell.trim() !== ''));
        }

        // 2. RENDERING: Populate the semantic table dynamically
        async function populateTable() {
            const table = document.querySelector('table[data-csv-src]');
            if (!table) return;
            const src = table.dataset.csvSrc;
            if (!src) return;

            try {
                const response = await fetch(src);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const text = await response.text();
                const data = parseCSV(text);

                if (data.length === 0) {
                    table.innerHTML = "<caption>CSV is empty.</caption>";
                    return;
                }

                const [headers, ...rows] = data;

                const hiddenIndices = new Set();
                headers.forEach((headerText, index) => {
                    if (hiddenColumns.includes(headerText.trim())) {
                        hiddenIndices.add(index);
                    }
                });

                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                const caption = table.querySelector("caption");

                // 3. Generate headers, returning `null` if the index is in our hidden Set
                const thElements = headers.map((text, index) => {
                    if (hiddenIndices.has(index)) return null; // Skip this column

                    const th = document.createElement("th");
                    th.setAttribute('scope', 'col');
                    let originalText = text.trim();
                    th.textContent = headerAliases[originalText] || originalText;
                    return th;
                }).filter(Boolean); // .filter(Boolean) removes the `null` values from the array

                table.style.setProperty('--col-count', thElements.length);
                headerRow.append(...thElements);
                thead.appendChild(headerRow);

                const tbody = document.createElement("tbody");
                for (const rowData of rows) {
                    const tr = document.createElement("tr");

                    // 4. Generate cells, skipping the ones at the hidden indices
                    const tdElements = rowData.map((text, index) => {
                        if (hiddenIndices.has(index)) return null; // Skip this column

                        const td = document.createElement("td");
                        td.textContent = text.trim();
                        return td;
                    }).filter(Boolean);

                    tr.append(...tdElements);
                    tbody.appendChild(tr);
                }

                table.replaceChildren(...[caption, thead, tbody].filter(Boolean));

            } catch (error) {
                console.error('Error loading CSV:', error);
                table.innerHTML = `<caption>Error loading data.</caption>`;
            }
        }

        // 3. ORCHESTRATION
        populateTable();
    </script>
</head>

<body>
    <header>
        <h1>Guild</h1>
    </header>

    <!-- We use a wrapper strictly for managing mobile horizontal scrolling overflow -->
    <main class="table-container">
        <table data-csv-src="exports/roster.csv">
            <!-- <caption>Roster</caption> -->
        </table>
    </main>
</body>

</html>
